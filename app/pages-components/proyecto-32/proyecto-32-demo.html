<section class="main__demo demo__slider">

    <div class="slider__panel">

        <div class="slider__top">

            <button class="slider__prev" type="button" aria-label="Diapositiva anterior">
                <i class="fa-solid fa-caret-left" aria-hidden="true"></i>
            </button>

            <section class="slider__slides" aria-live="polite">

                <article class="slides__item">
                    <img
                        class="slides__img"
                        src="/assets/img/proyecto-32/slide-1.jpg"
                        alt="Paisaje 1"
                        title="Paisaje 1"
                    >
                </article>

                <article class="slides__item">
                    <img
                        class="slides__img"
                        src="/assets/img/proyecto-32/slide-2.jpg"
                        alt="Paisaje 2"
                        title="Paisaje 2"
                    >
                </article>

                <article class="slides__item">
                    <img
                        class="slides__img"
                        src="/assets/img/proyecto-32/slide-3.jpg"
                        alt="Paisaje 3"
                        title="Paisaje 3"
                    >
                </article>

                <article class="slides__item">
                    <img
                        class="slides__img"
                        src="/assets/img/proyecto-32/slide-4.jpg"
                        alt="Paisaje 4"
                        title="Paisaje 4"
                    >
                </article>

                <article class="slides__item">
                    <img
                        class="slides__img"
                        src="/assets/img/proyecto-32/slide-5.jpg"
                        alt="Paisaje 5"
                        title="Paisaje 5"
                    >
                </article>

            </section>

            <button class="slider__next" type="button" aria-label="Diapositiva siguiente">
                <i class="fa-solid fa-caret-right" aria-hidden="true"></i>
            </button>

        </div>

        <div class="slider__bottom slider__bottom--sup">

            <div class="slider__btns">

                <div class="slider__autoplay-wrapper">
                    <button class="slider__autoplay-toggle" type="button">⏸ Pausar</button>
                </div>

            </div>

        </div>

        <div class="slider__bottom slider__bottom--inf">

            <div class="slider__btns">

                <button class="slider__prev" type="button" aria-label="Diapositiva anterior">
                    <i class="fa-solid fa-caret-left" aria-hidden="true"></i>
                </button>

                <div class="slider__autoplay-wrapper">
                    <button class="slider__autoplay-toggle" type="button">⏸ Pausar</button>
                </div>

                <button class="slider__next" type="button" aria-label="Diapositiva siguiente">
                    <i class="fa-solid fa-caret-right" aria-hidden="true"></i>
                </button>

            </div>

        </div>

    </div>

</section>
