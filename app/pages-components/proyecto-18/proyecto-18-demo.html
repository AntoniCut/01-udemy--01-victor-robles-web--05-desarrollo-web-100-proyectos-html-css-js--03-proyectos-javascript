<section class="main__demo demo__cronometro">

    <article class="cronometro__card">

        <h2 class="cronometro__title">Cronómetro</h2>

        <div
            class="cronometro__display"
            role="timer"
            aria-live="polite"
            aria-label="Tiempo transcurrido"
        >
            <span class="cronometro__minutes">00</span>
            <span class="cronometro__separator" aria-hidden="true">:</span>
            <span class="cronometro__seconds">00</span>
            <span class="cronometro__separator" aria-hidden="true">:</span>
            <span class="cronometro__milliseconds">00</span>
        </div>

        <div class="cronometro__controls">
            <button type="button" class="cronometro__button cronometro__button--start">
                Iniciar
            </button>
            <button type="button" class="cronometro__button cronometro__button--stop" disabled>
                Parar
            </button>
            <button type="button" class="cronometro__button cronometro__button--reset">
                Reset
            </button>
        </div>

        <p class="cronometro__status" role="status" aria-live="polite">
            Cronómetro listo.
        </p>

    </article>

</section>
