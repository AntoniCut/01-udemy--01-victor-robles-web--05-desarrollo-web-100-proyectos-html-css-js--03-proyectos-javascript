<section class="main__demo demo__password-eye">

    <form class="password-eye__form" autocomplete="off">

        <input
            class="password-eye__input"
            id="password-eye-input"
            type="password"
            name="clave-demo"
            placeholder="Introduce tu contraseña"
            autocomplete="off"
            aria-label="Contraseña"
        >

        <button
            class="password-eye__toggle"
            type="button"
            aria-label="Mostrar contraseña"
            aria-pressed="false"
        >
            <i class="password-eye__icon fa-solid fa-eye" aria-hidden="true"></i>
        </button>

    </form>

</section>
