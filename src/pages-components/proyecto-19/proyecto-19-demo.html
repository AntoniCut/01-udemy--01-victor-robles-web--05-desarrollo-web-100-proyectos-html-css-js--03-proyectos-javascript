<section class="main__demo demo__articulos">

    <section class="articulos__create" aria-labelledby="articulos-create-title">
        <h2 class="articulos__section-title" id="articulos-create-title">Crear artículo</h2>

        <form class="articulos__form">

            <div class="articulos__field">
                <label class="articulos__label" for="articulos-title">Título</label>
                <input
                    class="articulos__input"
                    type="text"
                    id="articulos-title"
                    name="title"
                    required
                >
            </div>

            <div class="articulos__field">
                <label class="articulos__label" for="articulos-subtitle">Subtítulo</label>
                <input
                    class="articulos__input"
                    type="text"
                    id="articulos-subtitle"
                    name="subtitle"
                    required
                >
            </div>

            <div class="articulos__field">
                <label class="articulos__label" for="articulos-description">Descripción</label>
                <textarea
                    class="articulos__input articulos__input--textarea"
                    id="articulos-description"
                    name="description"
                    rows="5"
                    required
                ></textarea>
            </div>

            <button type="submit" class="articulos__create-button">Crear artículo</button>

        </form>

        <p class="articulos__status" role="status" aria-live="polite"></p>
    </section>


    <section class="articulos__list" aria-labelledby="articulos-list-title">
        <h2 class="articulos__section-title" id="articulos-list-title">Artículos creados</h2>
        <div class="articulos__grid"></div>
    </section>

</section>
