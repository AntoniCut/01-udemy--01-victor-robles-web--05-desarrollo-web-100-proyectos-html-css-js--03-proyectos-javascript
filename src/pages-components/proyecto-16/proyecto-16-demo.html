<section class="main__demo demo__viewport">


    <article class="viewport__card">

        <h2 class="viewport__title">Información del entorno</h2>

        <div class="viewport__resultado" aria-live="polite">

            <section class="viewport__group">
                <h3 class="viewport__group-title">Navegador</h3>
                <dl class="viewport__data">
                    <div class="viewport__data-row">
                        <dt>Anchura</dt>
                        <dd class="viewport__browser-width"></dd>
                    </div>
                    <div class="viewport__data-row">
                        <dt>Altura</dt>
                        <dd class="viewport__browser-height"></dd>
                    </div>
                    <div class="viewport__data-row">
                        <dt>URL</dt>
                        <dd class="viewport__browser-url"></dd>
                    </div>
                </dl>
            </section>

            <section class="viewport__group">
                <h3 class="viewport__group-title">Ventana</h3>
                <dl class="viewport__data">
                    <div class="viewport__data-row">
                        <dt>Anchura</dt>
                        <dd class="viewport__window-width"></dd>
                    </div>
                    <div class="viewport__data-row">
                        <dt>Altura</dt>
                        <dd class="viewport__window-height"></dd>
                    </div>
                    <div class="viewport__data-row">
                        <dt>URL</dt>
                        <dd class="viewport__window-url"></dd>
                    </div>
                </dl>
            </section>

        </div>

        <p class="viewport__notice">
            Se abrirá la ruta externa en una nueva pestaña.
        </p>

    </article>


</section>
