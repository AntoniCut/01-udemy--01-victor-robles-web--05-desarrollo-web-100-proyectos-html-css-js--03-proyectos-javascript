<section class="main__demo demo__email">

    <form class="email__form">

        <input
            class="email__input"
            id="email-input"
            type="email"
            name="email"
            placeholder="Introduce tu Email"
            autocomplete="email"
            aria-label="Introduce tu email"
        >

        <div class="email__icons" aria-live="polite">
            <i class="email__check fa-solid fa-circle-check" aria-hidden="true"></i>
            <i class="email__error fa-solid fa-circle-xmark" aria-hidden="true"></i>
        </div>

    </form>

</section>
